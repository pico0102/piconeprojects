<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏈 Fantasy Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: { 50:'#fff7ed', 500:'#f97316', 600:'#ea580c', 700:'#c2410c' }
          }
        }
      }
    }
  </script>
  <!-- marked.js for markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <style>
    /* Custom scrollbar */
    #chat-log::-webkit-scrollbar { width: 4px; }
    #chat-log::-webkit-scrollbar-track { background: transparent; }
    #chat-log::-webkit-scrollbar-thumb { background: #f97316; border-radius: 9999px; }

    /* Prose for AI markdown */
    .prose-answer h1,.prose-answer h2,.prose-answer h3 { font-weight:700; margin:.75em 0 .25em; }
    .prose-answer h2 { font-size:1.05rem; color:#c2410c; }
    .prose-answer h3 { font-size:.95rem; color:#ea580c; }
    .prose-answer p  { margin:.35em 0; }
    .prose-answer ul,.prose-answer ol { padding-left:1.25em; margin:.35em 0; }
    .prose-answer li { margin:.15em 0; }
    .prose-answer table { border-collapse:collapse; width:100%; font-size:.82rem; margin:.5em 0; }
    .prose-answer th  { background:#fff7ed; color:#c2410c; padding:4px 8px; text-align:left; border-bottom:2px solid #f97316; }
    .prose-answer td  { padding:3px 8px; border-bottom:1px solid #fed7aa; }
    .prose-answer code { background:#fff7ed; color:#c2410c; padding:1px 4px; border-radius:4px; font-size:.85em; }
    .prose-answer pre code { background:transparent; padding:0; }
    .prose-answer pre  { background:#1e293b; color:#e2e8f0; padding:.75em 1em; border-radius:8px; overflow-x:auto; font-size:.82em; margin:.5em 0; }
    .prose-answer strong { color:#1e293b; }
    .prose-answer blockquote { border-left:3px solid #f97316; padding-left:.75em; color:#57534e; font-style:italic; }

    .dot-flashing { display:inline-flex; gap:4px; }
    .dot-flashing span { width:7px; height:7px; border-radius:50%; background:#f97316; animation:dotFlash 1.2s infinite; }
    .dot-flashing span:nth-child(2) { animation-delay:.2s; }
    .dot-flashing span:nth-child(3) { animation-delay:.4s; }
    @keyframes dotFlash { 0%,80%,100%{opacity:.2} 40%{opacity:1} }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex flex-col font-sans">

  <!-- Header -->
  <header class="bg-brand-600 text-white px-4 py-3 shadow-md flex items-center gap-3 sticky top-0 z-10 flex-wrap">
    <span class="text-2xl">🏈</span>
    <div class="flex-1">
      <p id="header-title" class="font-bold text-sm leading-tight">Tony Romo's DUI Mugshot</p>
      <p id="header-subtitle" class="text-xs text-orange-200 leading-tight">Loser eats an egg • half-PPR</p>
    </div>
    
    <!-- League Context Toggle -->
    <div class="flex items-center space-x-2 text-xs mr-2">
      <span id="label-egg" class="font-bold text-white">Egg</span>
      <button id="league-toggle" class="relative inline-flex h-5 w-10 items-center rounded-full bg-brand-700 transition-colors focus:outline-none ring-1 ring-brand-500" onclick="toggleLeague()">
        <span id="toggle-knob" class="inline-block h-3.5 w-3.5 transform rounded-full bg-white transition-transform translate-x-1"></span>
      </button>
      <span id="label-survivor" class="text-brand-200">Survivor</span>
    </div>

    <span id="status-dot" class="ml-auto w-2.5 h-2.5 rounded-full bg-green-300 shadow shadow-green-300/50" title="API online"></span>
  </header>

  <!-- Chat log -->
  <main id="chat-log" class="flex-1 overflow-y-auto px-3 py-4 space-y-3 max-w-2xl w-full mx-auto">
    <!-- Welcome bubble -->
    <div class="flex gap-2 items-start">
      <span class="text-xl flex-shrink-0 mt-0.5">🤖</span>
      <div class="bg-white border border-orange-100 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm max-w-prose">
        <p class="text-sm text-gray-700">Hey Anthony 👋 — I'm watching your roster live. Ask me anything or tap a quick button below.</p>
      </div>
    </div>
  </main>

  <!-- Quick-action buttons -->
  <section class="px-3 pb-2 max-w-2xl w-full mx-auto">
    <div id="quick-btns" class="flex gap-2 flex-wrap">
      <button onclick="sendQuick('Analyze my lineup for this week and tell me who to start.')"
        class="quick-btn bg-brand-50 border border-brand-500 text-brand-700 text-xs font-semibold px-3 py-1.5 rounded-full hover:bg-brand-500 hover:text-white transition-colors">
        📋 Analyze Lineup
      </button>
      <button onclick="sendQuick('What are the best waiver wire pickups available for my team right now?')"
        class="quick-btn bg-brand-50 border border-brand-500 text-brand-700 text-xs font-semibold px-3 py-1.5 rounded-full hover:bg-brand-500 hover:text-white transition-colors">
        📡 Waiver Targets
      </button>
      <button onclick="sendQuick('Give me a start/sit decision breakdown for my flex spots and any close calls this week.')"
        class="quick-btn bg-brand-50 border border-brand-500 text-brand-700 text-xs font-semibold px-3 py-1.5 rounded-full hover:bg-brand-500 hover:text-white transition-colors">
        ⚖️ Start / Sit
      </button>
      <button onclick="sendQuick('Give me a matchup preview for this week — who are the key players and what does this week turn on?')"
        class="quick-btn bg-brand-50 border border-brand-500 text-brand-700 text-xs font-semibold px-3 py-1.5 rounded-full hover:bg-brand-500 hover:text-white transition-colors">
        🔍 Matchup Preview
      </button>
    </div>
  </section>

  <!-- Input bar -->
  <footer class="bg-white border-t border-gray-200 px-3 py-3 max-w-2xl w-full mx-auto sticky bottom-0">
    <form id="chat-form" class="flex gap-2 items-end">
      <textarea
        id="user-input"
        rows="1"
        placeholder="Ask about your roster, waivers, trades…"
        class="flex-1 resize-none rounded-2xl border border-gray-300 focus:border-brand-500 focus:ring-2 focus:ring-brand-500/30 px-4 py-2.5 text-sm outline-none leading-snug max-h-32 overflow-y-auto"
        onkeydown="handleKey(event)"
      ></textarea>
      <button
        type="submit"
        id="send-btn"
        class="flex-shrink-0 bg-brand-600 hover:bg-brand-700 active:scale-95 text-white rounded-2xl p-2.5 transition-all shadow"
        aria-label="Send">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5">
          <path d="M3.478 2.404a.75.75 0 0 0-.926.941l2.432 7.905H13.5a.75.75 0 0 1 0 1.5H4.984l-2.432 7.905a.75.75 0 0 0 .926.94 60.519 60.519 0 0 0 18.445-8.986.75.75 0 0 0 0-1.218A60.517 60.517 0 0 0 3.478 2.404Z" />
        </svg>
      </button>
    </form>
  </footer>

<script>
  const chatLog   = document.getElementById('chat-log');
  const userInput = document.getElementById('user-input');
  const sendBtn   = document.getElementById('send-btn');
  const chatForm  = document.getElementById('chat-form');

  const API_BASE = 'https://fantasy-ai-service-519501469706.us-east1.run.app';

  // Auto-grow textarea
  userInput.addEventListener('input', () => {
    userInput.style.height = 'auto';
    userInput.style.height = Math.min(userInput.scrollHeight, 128) + 'px';
  });

  function handleKey(e) {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); submitQuery(); }
  }

  chatForm.addEventListener('submit', e => { e.preventDefault(); submitQuery(); });

  function sendQuick(text) { userInput.value = text; submitQuery(); }

  function scrollBottom() {
    chatLog.scrollTo({ top: chatLog.scrollHeight, behavior: 'smooth' });
  }

  function appendBubble(role, html, isLoading = false, extraData = null) {
    const wrap = document.createElement('div');
    wrap.className = 'flex gap-2 items-start';

    if (role === 'user') {
      wrap.innerHTML = `
        <div class="ml-auto bg-brand-600 text-white rounded-2xl rounded-tr-sm px-4 py-2.5 shadow-sm max-w-prose text-sm">
          ${escapeHtml(html)}
        </div>
        <span class="text-xl flex-shrink-0 mt-0.5">👤</span>`;
    } else {
      let footerHtml = '';
      if (!isLoading && extraData && extraData.latency_ms !== undefined) {
        const latencySec = (extraData.latency_ms / 1000).toFixed(1);
        let pillsHtml = '';
        let detailsHtml = '';
        if (extraData.data_sources) {
           const sources = Object.entries(extraData.data_sources);
           if (sources.length > 0) {
             const pills = sources.map(([key, val]) => {
                const isOk = val.status === 'ok';
                const icon = isOk ? '🟢' : '🔴';
                const colorClass = isOk ? 'text-green-600' : 'text-red-500';
                const name = key.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                return `<span class="${colorClass}">${icon} ${name}</span>`;
             }).join('  ');
             pillsHtml = ` | <span class="cursor-pointer hover:underline" onclick="this.parentElement.nextElementSibling.classList.toggle('hidden')">${pills}</span>`;
             
             const detailsRows = sources.map(([key, val]) => {
                const name = key.split('_').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
                return `<div><strong>${name}:</strong> ${val.status === 'ok' ? val.detail : val.error}</div>`;
             }).join('');
             detailsHtml = `<div class="hidden mt-2 p-2 bg-gray-100 rounded text-xs text-gray-600">${detailsRows}</div>`;
           }
        }
        footerHtml = `<div class="mt-2 pt-2 border-t border-gray-100 text-xs text-gray-400">⚡ ${latencySec}s ${pillsHtml}</div>${detailsHtml}`;
      }

      const inner = isLoading
        ? `<div class="flex flex-col items-start gap-1">
             <div class="flex items-center gap-2">
               <span id="loading-text" class="text-xs text-orange-500 font-semibold tracking-wide uppercase">Consulting the GM...</span>
               <button id="retry-btn" class="hidden text-xs bg-orange-100 text-orange-700 px-2 py-0.5 rounded border border-orange-200 hover:bg-orange-200 transition-colors" onclick="submitQuery(true)">Retry</button>
             </div>
             <div class="dot-flashing mt-1"><span></span><span></span><span></span></div>
             <a href="#" id="cancel-link" class="text-[10px] text-gray-400 hover:text-gray-600 underline mt-1" onclick="cancelRequest(event)">Cancel</a>
           </div>`
        : `<div class="prose-answer text-sm text-gray-800">${html}</div>${footerHtml}`;
      wrap.innerHTML = `
        <span class="text-xl flex-shrink-0 mt-0.5">🤖</span>
        <div id="${isLoading ? 'loading-bubble' : ''}" class="bg-white border border-orange-100 rounded-2xl rounded-tl-sm px-4 py-3 shadow-sm max-w-prose min-w-[60px] w-full">
          ${inner}
        </div>`;
    }
    chatLog.appendChild(wrap);
    scrollBottom();
    return wrap;
  }

  let currentLeagueContext = "egg";

  function toggleLeague() {
    currentLeagueContext = currentLeagueContext === "egg" ? "survivor" : "egg";
    
    // UI Updates
    const knob = document.getElementById("toggle-knob");
    const labelEgg = document.getElementById("label-egg");
    const labelSurvivor = document.getElementById("label-survivor");
    const headerTitle = document.getElementById("header-title");
    const headerSubtitle = document.getElementById("header-subtitle");
    const header = document.querySelector("header");

    if (currentLeagueContext === "survivor") {
      knob.classList.replace("translate-x-1", "translate-x-5");
      labelEgg.classList.replace("font-bold", "font-normal");
      labelEgg.classList.replace("text-white", "text-brand-200");
      labelSurvivor.classList.replace("font-normal", "font-bold");
      labelSurvivor.classList.replace("text-brand-200", "text-white");
      headerTitle.innerText = "Fat Crew Survivor";
      headerSubtitle.innerText = "Pick 'em • Win the pool";
      // Switch to a slightly different header color for visual context
      header.classList.replace("bg-brand-600", "bg-slate-800");
      document.getElementById("league-toggle").classList.replace("bg-brand-700", "bg-slate-600");
    } else {
      knob.classList.replace("translate-x-5", "translate-x-1");
      labelSurvivor.classList.replace("font-bold", "font-normal");
      labelSurvivor.classList.replace("text-white", "text-brand-200");
      labelEgg.classList.replace("font-normal", "font-bold");
      labelEgg.classList.replace("text-brand-200", "text-white");
      headerTitle.innerText = "Tony Romo's DUI Mugshot";
      headerSubtitle.innerText = "Loser eats an egg • half-PPR";
      header.classList.replace("bg-slate-800", "bg-brand-600");
      document.getElementById("league-toggle").classList.replace("bg-slate-600", "bg-brand-700");
    }
  }

  function escapeHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  let activeController = null;
  let timer30 = null;
  let timer60 = null;
  let loadingInterval = null;
  let currentQuery = "";

  function cancelRequest(e) {
    if (e) e.preventDefault();
    if (activeController) {
      activeController.abort();
      activeController = null;
    }
    clearTimeout(timer30); clearTimeout(timer60); clearInterval(loadingInterval);
    const loadingBubble = document.getElementById('loading-bubble');
    if (loadingBubble) {
      loadingBubble.closest('.flex').remove();
      appendBubble('bot', `<p class="text-gray-500 text-sm italic">Request cancelled</p>`);
    }
    sendBtn.disabled = false;
    sendBtn.classList.remove('opacity-50');
  }

  async function submitQuery(isRetry = false) {
    const q = isRetry === true ? currentQuery : userInput.value.trim();
    if (!q) return;

    if (isRetry !== true) {
      currentQuery = q;
      userInput.value = '';
      userInput.style.height = 'auto';
      appendBubble('user', q);
    }

    sendBtn.disabled = true;
    sendBtn.classList.add('opacity-50');

    const oldLoading = document.getElementById('loading-bubble');
    if (oldLoading) oldLoading.closest('.flex').remove();

    appendBubble('bot', '', true);

    if (activeController) activeController.abort();
    activeController = new AbortController();

    clearTimeout(timer30); clearTimeout(timer60); clearInterval(loadingInterval);

    const loadingTasks = currentLeagueContext === 'survivor' 
      ? [
          "Syncing survivor pool state...",
          "Fetching latest Vegas odds...",
          "Analyzing public pick trends...",
          "Evaluating future week value...",
          "Calculating win probabilities...",
          "Formulating survivor pick...",
          "Finalizing recommendation..."
        ]
      : [
          "Fetching live Sleeper state...",
          "Syncing league rosters...",
          "Analyzing matchup history...",
          "Scanning trending waiver targets...",
          "Blending actual points with projections...",
          "Running lineup optimization...",
          "Evaluating trade deltas...",
          "Reviewing injury reports...",
          "Formulating GM recommendation...",
          "Finalizing response..."
        ];
    let taskIndex = 0;

    loadingInterval = setInterval(() => {
      const lt = document.getElementById('loading-text');
      if (lt) {
        lt.innerText = loadingTasks[taskIndex % loadingTasks.length];
        taskIndex++;
      }
    }, 1200);

    timer30 = setTimeout(() => {
      const lt = document.getElementById('loading-text');
      if (lt) lt.innerText = 'Taking longer than usual...';
    }, 30000);

    timer60 = setTimeout(() => {
      const rb = document.getElementById('retry-btn');
      if (rb) rb.classList.remove('hidden');
    }, 60000);

    try {
      const resp = await fetch(`${API_BASE}/api/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ query: q, league_context: currentLeagueContext }),
        signal: activeController.signal
      });

      const loadingBubble = document.getElementById('loading-bubble');
      if (loadingBubble) loadingBubble.closest('.flex').remove();
      clearTimeout(timer30); clearTimeout(timer60); clearInterval(loadingInterval);

      if (!resp.ok) {
        const err = await resp.json().catch(() => ({ detail: 'Server error' }));
        appendBubble('bot', `<p class="text-red-600 text-sm">⚠️ ${escapeHtml(err.detail || 'Unknown error')}</p>`);
      } else {
        const data = await resp.json();
        const renderedMd = marked.parse(data.answer || '_(empty response)_');
        appendBubble('bot', renderedMd, false, data);
      }
    } catch (err) {
      if (err.name === 'AbortError') return;
      const loadingBubble = document.getElementById('loading-bubble');
      if (loadingBubble) loadingBubble.closest('.flex').remove();
      clearTimeout(timer30); clearTimeout(timer60); clearInterval(loadingInterval);
      appendBubble('bot', `<p class="text-red-600 text-sm">⚠️ Network error: ${escapeHtml(String(err))}</p>`);
    } finally {
      if (!activeController || !activeController.signal.aborted) {
        sendBtn.disabled = false;
        sendBtn.classList.remove('opacity-50');
        userInput.focus();
        scrollBottom();
      }
    }
  }

  // Check health on load
  fetch(`${API_BASE}/health`).then(r => {
    const dot = document.getElementById('status-dot');
    dot.className = r.ok
      ? 'ml-auto w-2.5 h-2.5 rounded-full bg-green-300 shadow shadow-green-300/50'
      : 'ml-auto w-2.5 h-2.5 rounded-full bg-red-400 shadow shadow-red-400/50';
    dot.title = r.ok ? 'API online' : 'API offline';
  }).catch(() => {
    const dot = document.getElementById('status-dot');
    dot.className = 'ml-auto w-2.5 h-2.5 rounded-full bg-red-400 shadow shadow-red-400/50';
    dot.title = 'API unreachable';
  });
</script>
</body>
</html>
